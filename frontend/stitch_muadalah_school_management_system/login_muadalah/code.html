<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;font-family:'Inter',sans-serif;}body{overscroll-behavior:none;background-color:#f7f9fb;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={theme:{extend:{"colors":{"tertiary-container":"#bf3003","warning-izin":"#F59E0B","surface-variant":"#e0e3e5","on-secondary-container":"#54647a","tertiary-fixed-dim":"#ffb4a1","inverse-surface":"#2d3133","surface-tint":"#004ced","secondary-container":"#d0e1fb","on-secondary-fixed":"#0b1c30","secondary-fixed":"#d3e4fe","primary-container":"#0052ff","surface-dim":"#d8dadc","surface-container":"#eceef0","primary-fixed-dim":"#b7c4ff","on-surface-variant":"#434656","on-tertiary":"#ffffff","on-surface":"#191c1e","inverse-on-surface":"#eff1f3","on-secondary":"#ffffff","on-primary-fixed-variant":"#0038b6","outline":"#737688","primary-fixed":"#dde1ff","tertiary-fixed":"#ffdbd2","surface-bright":"#f7f9fb","text-main":"#0D0C22","secondary":"#505f76","surface-container-highest":"#e0e3e5","on-tertiary-fixed-variant":"#891e00","surface-container-lowest":"#ffffff","on-tertiary-fixed":"#3c0800","surface-container-high":"#e6e8ea","success-hadir":"#10B981","border-subtle":"#E2E8F0","surface":"#f7f9fb","on-primary-fixed":"#001452","danger-alfa":"#EF4444","primary":"#003ec7","on-error-container":"#93000a","secondary-fixed-dim":"#b7c8e1","error-container":"#ffdad6","outline-variant":"#c3c5d9","on-background":"#191c1e","surface-card":"#FFFFFF","on-tertiary-container":"#ffddd5","on-secondary-fixed-variant":"#38484d","on-primary-container":"#dfe3ff","inverse-primary":"#b7c4ff","tertiary":"#952200","surface-container-low":"#f2f4f6","background":"#f7f9fb","on-error":"#ffffff","on-primary":"#ffffff","error":"#ba1a1a"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"xs":"8px","md":"16px","sm":"12px","margin-mobile":"16px","lg":"24px","gutter":"24px","margin-desktop":"32px","base":"4px","xl":"32px"},"fontFamily":{"body-md":["Inter"],"body-lg":["Inter"],"display-lg":["Inter"],"body-sm":["Inter"],"headline-lg":["Inter"],"headline-md":["Inter"],"headline-sm":["Inter"],"caption":["Inter"],"label-md":["Inter"]},"fontSize":{"body-md":["16px",{"lineHeight":"1.5","fontWeight":"400"}],"body-lg":["18px",{"lineHeight":"1.6","fontWeight":"400"}],"display-lg":["48px",{"lineHeight":"1.2","letterSpacing":"-0.02em","fontWeight":"700"}],"body-sm":["14px",{"lineHeight":"1.5","fontWeight":"400"}],"headline-lg":["32px",{"lineHeight":"1.25","fontWeight":"700"}],"headline-md":["24px",{"lineHeight":"1.3","fontWeight":"600"}],"headline-sm":["20px",{"lineHeight":"1.4","fontWeight":"600"}],"caption":["12px",{"lineHeight":"1.4","fontWeight":"500"}],"label-md":["14px",{"lineHeight":"1","letterSpacing":"0.05em","fontWeight":"600"}]}}}}</script></head><body class="bg-surface flex items-center justify-center min-h-screen p-margin-mobile"><main class="w-full max-w-md"><div class="flex flex-col w-full h-full justify-center items-center relative overflow-hidden bg-surface">
<!-- Background Image with Scrim -->
<div class="absolute inset-0 z-0">
<div class="bg-cover bg-center w-full h-full" data-alt="A softly blurred, high-end professional educational environment, perhaps a modern school library or administrative office, seen through a cool, vibrant blue translucent overlay. The lighting is bright and optimistic, conveying trust and efficiency. The overall mood is modern corporate and authoritative." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA2RBmtJZG2L60jU3Gpprt_ZWLcckhakds0avKVs6uD1ZQb4FQ2C3nLTwQ3rGpQh1N4B8vmEDqj6fDYNQyvtk-Ld1VAG7Vqig9pJZiDjRq5BCrMvy2hcGUL_v_cAj7h9eDfGksfLw0iFIYkHcAmj_XaRHJx15Uxe0Jxs7oQbK3Z4vS8IY6tnnm5RYAYzvljoBQQl5VCJgB5t5krw6rkU-hV1dO6CO5ZNs4e80dXKdSFmNWGWEc1gRP3-Q')"></div>
<div class="absolute inset-0 bg-primary/80 mix-blend-multiply"></div>
<div class="absolute inset-0 bg-gradient-to-br from-surface/40 to-surface/90 backdrop-blur-sm"></div>
</div>
<!-- Abstract Decorative Elements -->
<div class="absolute top-0 right-0 w-[600px] h-[600px] bg-primary-fixed/20 rounded-full blur-[100px] translate-x-1/2 -translate-y-1/2 z-0"></div>
<div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-secondary-fixed/30 rounded-full blur-[80px] -translate-x-1/3 translate-y-1/3 z-0"></div>
<!-- Login Card Container -->
<div class="w-full max-w-[440px] z-10 p-margin-mobile md:p-0">
<div class="bg-surface-card rounded-[24px] shadow-xl shadow-on-surface/5 w-full flex flex-col p-lg md:p-xl relative overflow-hidden transition-all duration-300 hover:shadow-2xl hover:shadow-on-surface/10">
<!-- Subtle internal decoration -->
<div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-primary-container"></div>
<!-- Logo Area -->
<div class="flex flex-col items-center justify-center mb-xl">
<div class="w-16 h-16 bg-primary-container/10 rounded-2xl flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-primary text-[32px]">school</span>
</div>
<h1 class="font-headline-md text-on-surface text-center tracking-tight">Sistem Manajemen Muadalah</h1>
<p class="font-body-sm text-on-surface-variant text-center mt-base">Masuk untuk mengelola administrasi sekolah</p>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault(); document.getElementById('loading-overlay').classList.remove('hidden'); setTimeout(() =&gt; document.getElementById('loading-overlay').classList.add('hidden'), 2000);">
<!-- School Selection -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-on-surface">Pilih Unit Sekolah</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-border-subtle rounded-lg px-md py-[14px] font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all cursor-pointer">
<option value="all">Semua Unit (Super Admin)</option>
<option value="smp">SMP Muadalah</option>
<option value="sma">SMA Muadalah</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-md pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Username/Email -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-on-surface" for="username">Email atau Username</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 flex items-center pl-md text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded-lg pl-11 pr-md py-[14px] font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="username" placeholder="admin@muadalah.sch.id" required="" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface" for="password">Kata Sandi</label>
<a class="font-caption text-primary hover:text-primary-container transition-colors" href="#">Lupa Kata Sandi?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 flex items-center pl-md text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded-lg pl-11 pr-11 py-[14px] font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-md text-on-surface-variant hover:text-on-surface transition-colors" onclick="const p = document.getElementById('password'); const i = this.querySelector('span'); if(p.type==='password'){p.type='text';i.textContent='visibility_off';}else{p.type='password';i.textContent='visibility';}" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm mt-xs">
<div class="relative flex items-center">
<input class="peer appearance-none w-5 h-5 border border-border-subtle rounded-[4px] bg-surface-container-lowest checked:bg-primary checked:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer" id="remember" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary text-[16px] pointer-events-none opacity-0 peer-checked:opacity-100 transition-opacity top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<label class="font-body-sm text-on-surface-variant cursor-pointer select-none hover:text-on-surface transition-colors" for="remember">Ingat Saya</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md py-4 rounded-lg shadow-md shadow-primary/20 hover:shadow-lg hover:shadow-primary/30 transition-all flex items-center justify-center gap-xs mt-xs relative overflow-hidden group" type="submit">
<span class="relative z-10">Masuk ke Dashboard</span>
<span class="material-symbols-outlined relative z-10 group-hover:translate-x-1 transition-transform">arrow_forward</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
</button>
</form>
</div>
<!-- Footer links -->
<div class="mt-lg flex justify-center gap-md font-caption text-surface-container-highest mix-blend-screen">
<a class="hover:text-white transition-colors" href="#">Bantuan</a>
<span>•</span>
<a class="hover:text-white transition-colors" href="#">Kebijakan Privasi</a>
<span>•</span>
<a class="hover:text-white transition-colors" href="#">Syarat &amp; Ketentuan</a>
</div>
</div>
<!-- Loading Overlay (Hidden by default) -->
<div class="hidden absolute inset-0 bg-surface/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center" id="loading-overlay">
<div class="w-12 h-12 border-4 border-surface-variant border-t-primary rounded-full animate-spin"></div>
<p class="font-label-md text-on-surface mt-md animate-pulse">Mengautentikasi...</p>
</div>
</div></main></body></html>
